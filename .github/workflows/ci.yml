name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ hashFiles('DESCRIPTION') }}
      - name: Install R packages
        run: |
          install.packages(c("ggplot2", "dplyr", "readr", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}
      - name: Smoke test
        run: Rscript tests/test-smoke.R
